<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory | Essie Cyber</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#1e293b">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .keypad-btn:active { transform: scale(0.95); background-color: #e2e8f0; }
        .pin-dot { transition: all 0.2s ease; }
    </style>

    <style>
        body { animation: fadeIn 0.2s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(2px); } to { opacity: 1; transform: translateY(0); } }
    </style>

</head>
<body class="bg-gray-100 h-screen flex flex-col font-sans text-gray-800 overflow-hidden">

    <nav class="bg-slate-900 text-white shadow-md flex-shrink-0">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-14">
                <div class="flex items-center">
                    <span class="text-xl font-bold text-blue-400">Essie Cyber</span>
                </div>
                <div class="flex space-x-2 overflow-x-auto">
                    <a href="/pos.html" class="px-3 py-1.5 text-sm font-medium rounded bg-slate-700 hover:bg-slate-600">POS</a>
                    <a href="/inventory.html" class="px-3 py-1.5 text-sm font-medium rounded  bg-blue-600">Inventory</a>
                    <a href="/customers.html" class="px-3 py-1.5 text-sm font-medium rounded admin-only hidden bg-slate-700 hover:bg-slate-600">Customers</a>
                    <a href="/users.html" class="px-3 py-1.5 text-sm font-medium rounded admin-only hidden bg-slate-700 hover:bg-slate-600">Users</a>
                    <a href="/admin.html" class="px-3 py-1.5 text-sm font-medium rounded admin-only hidden bg-slate-700 hover:bg-slate-600">Admin / Resources</a>
                    <a href="/analytics.html" class="px-3 py-1.5 text-sm font-medium rounded admin-only hidden bg-slate-700 hover:bg-slate-600">Analytics</a>
                    <button id="btn-logout" class="px-3 py-1.5 text-sm font-medium rounded border border-slate-600 hover:bg-slate-800 text-red-400">Logout</button>
                </div>
            </div>
        </div>
    </nav>

    <main class="flex-1 overflow-y-auto p-6 max-w-7xl mx-auto w-full">
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-6">
            <h1 class="text-2xl font-bold text-slate-800">Inventory Management</h1>
            <div class="flex items-center gap-2"><input type="text" id="inv-search" placeholder="Search inventory..." class="border border-slate-300 rounded px-3 py-2 w-64 focus:outline-none focus:ring-2 focus:ring-blue-500"><button id="btn-add-item" class="bg-blue-600 text-white px-4 py-2 rounded font-bold hover:bg-blue-700">+ Add New Item</button></div>
        </div>
        
        <div class="bg-white rounded-xl shadow border border-slate-200 overflow-hidden">
            <table class="w-full text-left text-sm">
                <thead class="bg-slate-50 text-slate-600">
                    <tr><th class="py-3 px-4 border-b">Name</th><th class="py-3 px-4 border-b">Type</th><th class="py-3 px-4 border-b text-right">Buying</th><th class="py-3 px-4 border-b text-right">Selling</th><th class="py-3 px-4 border-b text-center">Stock</th><th class="py-3 px-4 border-b text-center">Actions</th></tr>
                </thead>
                <tbody id="inv-tbody" class="divide-y divide-slate-100"></tbody>
            </table>
        </div>
    </main>
    <script type="module" src="/js/inventory.js"></script>
</body></html>
